<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | DAM Photography</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg-dark:#111314; --text-light:#eaeaea; --text-muted:#9a9a9a; --accent:#1ecad3; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
    body { background:var(--bg-dark); color:var(--text-light); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { width:100%; max-width:520px; background:#0d0f10; border:1px solid #1a1c1d; border-radius:18px; padding:28px; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
    .logo { font-weight:800; letter-spacing:0.5px; }
    .small { color:var(--text-muted); font-size:13px; }
    h1 { font-size:22px; margin-bottom:6px; }
    p { color:var(--text-muted); font-size:14px; line-height:1.7; }
    form { margin-top:18px; }
    .form-group { margin-bottom:16px; }
    label { display:block; font-size:13px; color:var(--text-muted); margin-bottom:8px; }
    input { width:100%; padding:14px; background:#111314; border:1px solid #1a1c1d; border-radius:12px; color:var(--text-light); font-size:14px; }
    input:focus { outline:none; border-color:var(--accent); }
    .btn { width:100%; padding:14px 18px; border:none; cursor:pointer; border-radius:12px; background:var(--accent); color:#000; font-weight:800; transition:transform .15s ease; }
    .btn:hover { transform:translateY(-2px); }
    .row { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-top:12px; }
    .link { color:var(--accent); text-decoration:none; font-weight:700; font-size:13px; }
    .error { display:none; background:rgba(255,80,80,0.12); border:1px solid rgba(255,80,80,0.3); color:#ffb5b5; padding:10px 12px; border-radius:12px; margin-top:14px; font-size:13px; }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <div class="logo">DAM.</div>
      <div class="small" id="auth-status"></div>
    </header>

    <h1>Create account</h1>
    <p>Accounts are stored in your browser (localStorage). This is a demo-only signup.</p>
    <p style="margin-top:10px; color: var(--text-light); font-size: 13px;">
      Admin login (static demo): <strong>admin@dam.com</strong> / <strong>Admin1234</strong>
    </p>

    <div class="error" id="errorBox"></div>

    <form id="registerForm" autocomplete="on">
      <div class="form-group">
        <label for="regEmail">Email</label>
        <input id="regEmail" name="email" type="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="regPassword">Password</label>
        <input id="regPassword" name="password" type="password" placeholder="Create a password" minlength="4" required />
      </div>
      <button class="btn" type="submit">Create account</button>

      <div class="row">
        <a class="link" href="login.html">I already have an account</a>
        <a class="link" href="index.html">Back</a>
      </div>
    </form>
  </div>

  <script src="auth.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const errorBox = document.getElementById('errorBox');

    function showError(msg) {
      if (!errorBox) return;
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const password = document.getElementById('regPassword').value;

      if (!email || !password) {
        showError('Please enter email and password.');
        return;
      }

      const users = window.DAM_AUTH.getUsers();
      const exists = users.some(u => String(u.email).toLowerCase() === email);

      if (exists) {
        showError('This email already has an account.');
        return;
      }

      users.push({ email, password });
      window.DAM_AUTH.setUsers(users);
      window.DAM_AUTH.setSession(email);
      window.location.replace('admin.html');
    });

    if (window.DAM_AUTH && typeof window.DAM_AUTH.initAuthPage === 'function') {
      window.DAM_AUTH.initAuthPage();
    }
  </script>
</body>
</html>
