<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DAM Explore Photographers</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- ICONS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

:root{
  --bg:#0b0d0e;
  --card:#111314;
  --line:#1f2224;
  --text:#eaeaea;
  --muted:#9a9a9a;
  --accent:#1ecad3;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins;
}

body{
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
.header{
  padding:20px 50px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  background:rgba(11,13,14,0.9);
  backdrop-filter:blur(10px);
}

.header h2{
  font-size:18px;
  color:var(--accent);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  padding:30px 50px;
}

/* CARD */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:15px;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:var(--accent);
}

/* PROFILE */
.profile{
  width:70px;
  height:70px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid var(--accent);
}

/* COVER INITIAL */
.cover{
  width:70px;
  height:70px;
  border-radius:50%;
  background:var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  font-weight:700;
  color:#000;
}

/* TOP SECTION */
.top{
  display:flex;
  gap:12px;
  align-items:center;
}

/* NAME */
h3{
  font-size:16px;
  margin-bottom:3px;
}

/* INFO */
.info{
  font-size:13px;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:4px;
}

/* BADGE */
.badge{
  display:inline-block;
  margin-top:8px;
  padding:4px 10px;
  font-size:11px;
  border-radius:20px;
  background:rgba(30,202,211,0.15);
  color:var(--accent);
  border:1px solid rgba(30,202,211,0.3);
}

/* BIO */
.bio{
  font-size:12px;
  color:var(--muted);
  margin-top:10px;
  line-height:1.4;
}

/* WORK IMAGES */
.work{
  margin-top:10px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
}

.work img{
  width:100%;
  height:90px;
  object-fit:cover;
  border-radius:10px;
  transition:0.3s;
}

.work img:hover{
  transform:scale(1.05);
}

/* RESPONSIVE */
@media(max-width:900px){
  .grid{
    grid-template-columns:1fr;
    padding:20px;
  }
  .header{
    padding:15px;
  }
}

</style>
</head>

<body>

<div class="header">
  <h2><i class="fa-solid fa-camera"></i> Explore Photographers</h2>
</div>

<div class="grid" id="gallery"></div>

<script>

function load(){

let photographers = JSON.parse(localStorage.getItem("photographers")) || [];

let box = document.getElementById("gallery");
box.innerHTML = "";

photographers.forEach(p => {

if(p.status === "approved"){

let images = p.portfolio || [];

box.innerHTML += `
<div class="card">

  <div class="top">

    ${p.profilePhoto 
      ? `<img class="profile" src="${p.profilePhoto}">`
      : `<div class="cover">${p.name.charAt(0)}</div>`
    }

    <div>
      <h3>${p.name}</h3>

      <div class="info">
        <i class="fa-solid fa-location-dot"></i>
        ${p.location}
      </div>

      <div class="info">
        <i class="fa-solid fa-briefcase"></i>
        ${p.experience} years
      </div>

    </div>
  </div>

  <div class="badge">
    <i class="fa-solid fa-circle-check"></i> Approved
  </div>

  <div class="bio">${p.bio || ""}</div>

  <div class="work">
    ${images.map(img => `<img src="${img}">`).join("")}
  </div>

</div>
`;
}

});

}

load();

/* auto refresh when admin updates */
window.addEventListener("storage", load);

</script>

</body>
</html>
