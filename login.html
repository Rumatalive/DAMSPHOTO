<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | DAM Photography</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #111314;
      --text-light: #eaeaea;
      --text-muted: #9a9a9a;
      --accent: #1ecad3;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg-dark); color: var(--text-light); min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 24px; }
    .card { width: 100%; max-width: 520px; background: #0d0f10; border: 1px solid #1a1c1d; border-radius: 18px; padding: 28px; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom: 18px; }
    .logo { font-weight: 800; letter-spacing: 0.5px; }
    .small { color: var(--text-muted); font-size: 13px; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    p { color: var(--text-muted); font-size: 14px; line-height: 1.7; }
    form { margin-top: 18px; }
    .form-group { margin-bottom: 16px; }
    label { display:block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
    input { width: 100%; padding: 14px; background: #111314; border: 1px solid #1a1c1d; border-radius: 12px; color: var(--text-light); font-size: 14px; }
    input:focus { outline: none; border-color: var(--accent); }
    .btn { width: 100%; padding: 14px 18px; border: none; cursor:pointer; border-radius: 12px; background: var(--accent); color: #000; font-weight: 800; transition: transform .15s ease; }
    .btn:hover { transform: translateY(-2px); }
    .row { display:flex; justify-content:space-between; align-items:center; gap: 12px; margin-top: 12px; }
    .link { color: var(--accent); text-decoration:none; font-weight: 700; font-size: 13px; }
    .error { display:none; background: rgba(255,80,80,0.12); border:1px solid rgba(255,80,80,0.3); color: #ffb5b5; padding: 10px 12px; border-radius: 12px; margin-top: 14px; font-size: 13px; }
    .hint { margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <div class="logo">DAM.</div>
      <div class="small" id="auth-status"></div>
    </header>

    <h1>Login</h1>
    <p>Sign in using your email. This demo stores users & session in <code>localStorage</code>.</p>

    <div class="error" id="errorBox"></div>

    <form id="loginForm" autocomplete="on">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" name="email" type="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" name="password" type="password" placeholder="••••••••" required />
      </div>
      <button class="btn" type="submit">Sign in</button>

      <div class="row">
        <a class="link" href="register.html">Create an account</a>
        <a class="link" href="index.html">Back to home</a>
      </div>
    </form>

    <p class="hint">New here? Use <strong>Register</strong> to create an account first.</p>
  </div>

  <script src="auth.js"></script>
  <script>
    // Verify auth.js loaded before any handlers rely on it.
    console.log('After loading auth.js, window.DAM_AUTH =', window.DAM_AUTH);
  </script>
  <script src="healthcheck-auth.js"></script>
  <script>

    const form = document.getElementById('loginForm');

    const errorBox = document.getElementById('errorBox');

    function showError(msg) {
      if (!errorBox) return;
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      // auth.js should define window.DAM_AUTH.
      const damAuth = window.DAM_AUTH;
      if (!damAuth) {
        showError('Authentication not available (auth.js not loaded).');
        return;
      }

      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const password = document.getElementById('loginPassword').value;

      // Admin shortcut (static credentials)
      // - email: admin@dam.com
      // - password: Admin1234
      if (email === 'admin@dam.com' && password === 'Admin1234') {
        damAuth.setSession(email);
        window.location.replace('admin.html');
        return;
      }

      const users = damAuth.getUsers();
      const user = users.find(u => String(u.email).toLowerCase() === email);


      if (!user || user.password !== password) {
        showError('Invalid email or password.');
        return;
      }

      window.DAM_AUTH.setSession(email);
      window.location.replace('admin.html');
    });

    // auth.js will update auth-status if present
    if (window.DAM_AUTH && typeof window.DAM_AUTH.initAuthPage === 'function') {
      window.DAM_AUTH.initAuthPage();
    }
  </script>
</body>
</html>
